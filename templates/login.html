<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber ReconX — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.8">
    <style>
        .auth-container { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 24px; 
            position: relative; 
            z-index: 2; 
        }
        
        .auth-card { 
            width: 100%; 
            max-width: 480px; 
            padding: 40px; 
            background: rgba(8, 10, 20, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 243, 255, 0.08);
            border-radius: var(--radius-lg);
            position: relative;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet));
            box-shadow: 0 0 12px var(--neon-cyan);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        
        .auth-header { 
            text-align: center; 
            margin-bottom: 28px; 
        }
        
        .auth-logo { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem; 
            font-weight: 900; 
            color: #fff; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 8px; 
            letter-spacing: 0.05em;
        }
        
        .auth-logo i { 
            color: var(--neon-cyan); 
            font-size: 1.8rem; 
            text-shadow: 0 0 10px var(--neon-cyan);
        }
        
        .auth-subtitle { 
            color: var(--text-secondary); 
            font-size: 0.85rem; 
            letter-spacing: 0.02em;
        }
        
        /* High Tech Session Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-secondary);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.05em;
            border-radius: 4px;
        }

        .auth-tab.active {
            background: rgba(6, 182, 212, 0.08);
            color: #fff;
            box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.15);
            text-shadow: 0 0 6px var(--neon-cyan);
        }
        
        .social-btn {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            width: 100%; 
            padding: 12px; 
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03); 
            color: #fff; 
            font-weight: 600; 
            font-size: 0.88rem;
            cursor: pointer; 
            transition: all 0.25s ease;
            text-decoration: none; 
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.03em;
        }
        
        .social-btn:hover { 
            background: rgba(255, 255, 255, 0.06); 
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            transform: translateY(-1.5px);
        }
        
        .divider { 
            display: flex; 
            align-items: center; 
            text-align: center; 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'Orbitron', sans-serif;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: 16px; }
        .divider:not(:empty)::after { margin-left: 16px; }
        
        .auth-submit { 
            width: 100%; 
            padding: 13px; 
            font-size: 0.95rem; 
            margin-top: 15px; 
            letter-spacing: 0.05em;
        }

        /* Verification Telemetry Log */
        .telemetry-log {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            max-height: 110px;
            overflow-y: auto;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .telemetry-log p {
            margin-bottom: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    
    <div class="auth-container">
        <div class="glass-card auth-card slide-up">
            <div class="auth-header">
                <a href="/" class="auth-logo"><i class="fa-solid fa-shield-halved"></i> Cyber ReconX</a>
                <p class="auth-subtitle" id="auth-sub-text">Sign in to your account to continue.</p>
            </div>

            <!-- Mode Toggle Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login" onclick="toggleAuthMode('login')"><i class="fa-solid fa-key"></i> SIGN IN</button>
                <button type="button" class="auth-tab" id="tab-register" onclick="toggleAuthMode('register')"><i class="fa-solid fa-user-plus"></i> SIGN UP</button>
            </div>
            
            <button type="button" class="social-btn" id="btn-google-sso">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="18" height="18">
                CONTINUE WITH GOOGLE
            </button>
            
            <div class="divider" id="auth-divider">or continue with email</div>
            
            <!-- Dynamic Auth Form -->
            <form id="secure-auth-form">
                <!-- Registration Specific Name Field (Hidden by default) -->
                <div class="input-group hidden" id="group-name">
                    <i class="fa-solid fa-id-card form-icon"></i>
                    <input type="text" id="auth-name-input" class="form-control has-icon" placeholder="Full Name">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope form-icon"></i>
                    <input type="email" id="auth-email-input" class="form-control has-icon" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock form-icon"></i>
                    <input type="password" id="auth-password-input" class="form-control has-icon" placeholder="Password" required>
                </div>

                <div class="flex-between mb-3" id="login-extra" style="font-size: 0.82rem; margin-top: -8px; margin-bottom: 20px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-secondary);">
                        <input type="checkbox" id="auth-remember" checked style="accent-color: var(--primary-cyan);"> Remember me
                    </label>
                    <a href="#" class="text-cyan" style="text-decoration:none; font-weight: 500;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-submit" id="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
            </form>

            <!-- Verification Progress Log -->
            <div class="telemetry-log" id="verification-telemetry">
                <!-- dynamically updated by script -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts (Resilient Google SSO Fallback Setup) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="/static/js/firebase-config.js"></script>

    <script>
        // Initialize Firebase
        if (typeof window.FIREBASE_CONFIG !== 'undefined') {
            firebase.initializeApp(window.FIREBASE_CONFIG);
        }
        
        let currentMode = 'login'; // 'login' or 'register'

        function toggleAuthMode(mode) {
            currentMode = mode;
            
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const groupName = document.getElementById('group-name');
            const nameInput = document.getElementById('auth-name-input');
            const loginExtra = document.getElementById('login-extra');
            const btnSubmit = document.getElementById('btn-submit');
            const subText = document.getElementById('auth-sub-text');
            const divider = document.getElementById('auth-divider');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                groupName.classList.add('hidden');
                nameInput.removeAttribute('required');
                loginExtra.style.display = 'flex';
                btnSubmit.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
                subText.innerText = 'Sign in to your account to continue.';
                divider.innerText = 'or continue with email';
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                groupName.classList.remove('hidden');
                nameInput.setAttribute('required', 'true');
                loginExtra.classList.add('hidden');
                btnSubmit.innerHTML = '<i class="fa-solid fa-user-check"></i> Sign Up';
                subText.innerText = 'Create an account to access the platform.';
                divider.innerText = 'or sign up with email';
            }
        }

        // Intercept Form Submission with Gorgeous Telemetry Verification Feed
        const authForm = document.getElementById('secure-auth-form');
        const telemetryFeed = document.getElementById('verification-telemetry');

        authForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('auth-email-input').value.trim();
            const password = document.getElementById('auth-password-input').value.trim();
            const name = document.getElementById('auth-name-input').value.trim();

            telemetryFeed.style.display = 'block';
            telemetryFeed.innerHTML = '<p class="text-cyan">[*] Requesting crypt-key handshake verification...</p>';
            telemetryFeed.scrollTop = telemetryFeed.scrollHeight;

            let progressStep = 0;
            const validationLogs = [
                { msg: '[*] Processing SHA-256 password hash signatures...', color: 'text-white' },
                { msg: '[*] Querying Operator Vanguard identity nodes...', color: 'text-yellow' },
                { msg: '[*] Authenticating credentials against security deck...', color: 'text-cyan' }
            ];

            const logInterval = setInterval(() => {
                if (progressStep < validationLogs.length) {
                    const log = validationLogs[progressStep];
                    telemetryFeed.innerHTML += `<p class="${log.color}">${log.msg}</p>`;
                    telemetryFeed.scrollTop = telemetryFeed.scrollHeight;
                    progressStep++;
                }
            }, 350);

            // Setup appropriate endpoint payload
            const endpoint = currentMode === 'login' ? '/api/login' : '/api/register';
            const payload = currentMode === 'login' 
                ? { email, password } 
                : { email, password, name };

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                clearInterval(logInterval);
                return res.json().then(data => ({ status: res.status, data }));
            })
            .then(({ status, data }) => {
                if (status === 200) {
                    telemetryFeed.innerHTML += '<p class="text-green">[✓] Biometric crypt-key verification successful.</p>';
                    telemetryFeed.innerHTML += '<p class="text-green">[*] Initialising secure operator terminal shell...</p>';
                    telemetryFeed.scrollTop = telemetryFeed.scrollHeight;
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 800);
                } else {
                    telemetryFeed.innerHTML += `<p class="text-red">[✗] Access Denied: ${data.error || 'Identity rejection.'}</p>`;
                    telemetryFeed.scrollTop = telemetryFeed.scrollHeight;
                }
            })
            .catch(err => {
                clearInterval(logInterval);
                telemetryFeed.innerHTML += '<p class="text-red">[✗] Connection error established: shell rejection.</p>';
                telemetryFeed.scrollTop = telemetryFeed.scrollHeight;
                console.error(err);
            });
        });

        // Firebase Google Login SSO integration
        const googleBtn = document.getElementById('btn-google-sso');
        if (googleBtn) {
            googleBtn.addEventListener('click', () => {
                telemetryFeed.style.display = 'block';
                telemetryFeed.innerHTML = '<p class="text-cyan">[*] Requesting single sign-on partner challenge...</p>';
                
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    firebase.auth().signInWithPopup(provider)
                    .then(result => {
                        telemetryFeed.innerHTML += '<p class="text-green">[✓] Google verification successful. Verifying session with master node...</p>';
                        return result.user.getIdToken();
                    })
                    .then(idToken => {
                        return fetch('/api/firebase-login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken })
                        });
                    })
                    .then(res => res.json())
                    .then(user => {
                        if (user.error) {
                            telemetryFeed.innerHTML += `<p class="text-red">[✗] Master node rejected signature: ${user.error}</p>`;
                            return;
                        }
                        telemetryFeed.innerHTML += '<p class="text-green">[✓] Secure shell established. Welcome, ' + user.name + '.</p>';
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 800);
                    })
                    .catch(err => {
                        telemetryFeed.innerHTML += `<p class="text-red">[✗] Identity validation failed: ${err.message || err}</p>`;
                        console.error(err);
                    });
                } else {
                    // Sandbox simulated SSO fallback if Firebase is offline or local dev configuration is pending
                    telemetryFeed.innerHTML += '<p class="text-yellow">[*] Firebase auth interface offline. Invoking simulated secure developer sandbox credential...</p>';
                    setTimeout(() => {
                        fetch('/api/auth/google', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                simulated: true,
                                email: currentMode === 'login' ? 'sandbox_operator@recon.local' : 'sandbox_recruit@recon.local',
                                name: currentMode === 'login' ? 'Sandbox Operator' : 'Sandbox Recruit'
                            })
                        })
                        .then(res => res.json())
                        .then(user => {
                            telemetryFeed.innerHTML += '<p class="text-green">[✓] Sandbox developer credential verified.</p>';
                            setTimeout(() => {
                                window.location.href = '/dashboard';
                            }, 800);
                        })
                        .catch(err => {
                            telemetryFeed.innerHTML += '<p class="text-red">[✗] Sandbox handshake rejected.</p>';
                        });
                    }, 800);
                }
            });
        }
    </script>
</body>
</html>
