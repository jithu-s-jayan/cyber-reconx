<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber ReconX — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 2; }
        .auth-card { width: 100%; max-width: 440px; padding: 40px; }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
        .auth-logo i { color: var(--primary-cyan); font-size: 1.8rem; }
        .auth-subtitle { color: var(--text-muted); font-size: 0.95rem; }
        
        .social-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 14px; border-radius: var(--radius-md);
            background: #ffffff; color: #000000; font-weight: 600; font-size: 0.95rem;
            cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none; border: none; margin-bottom: 24px;
        }
        .social-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.2); }
        
        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider:not(:empty)::before { margin-right: 16px; }
        .divider:not(:empty)::after { margin-left: 16px; }
        
        .auth-submit { width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px; }
        
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted); }
        .auth-footer a { color: var(--primary-cyan); text-decoration: none; transition: color 0.2s ease; }
        .auth-footer a:hover { color: #fff; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    
    <div class="auth-container">
        <div class="glass-card auth-card slide-up">
            <div class="auth-header">
                <a href="/" class="auth-logo"><i class="fa-solid fa-shield-halved"></i> Cyber ReconX</a>
                <p class="auth-subtitle">Welcome back. Please enter your details.</p>
            </div>
            
            <a href="/login/google" class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" width="20" height="20">
                Continue with Google
            </a>
            
            <div class="divider">or login with email</div>
            
            <form action="/login" method="POST">
                <div class="input-group">
                    <i class="fa-solid fa-envelope form-icon"></i>
                    <input type="email" name="email" class="form-control has-icon" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock form-icon"></i>
                    <input type="password" name="password" class="form-control has-icon" placeholder="Password" required>
                </div>
                <div class="flex-between mb-3" style="font-size: 0.85rem;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-secondary);">
                        <input type="checkbox" checked style="accent-color: var(--primary-indigo);"> Remember me
                    </label>
                    <a href="#" style="color:var(--primary-indigo); text-decoration:none;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
            </form>
            
            <div class="auth-footer">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
